<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Capture</title>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Capture"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg:#0a0a0a; --surf:#141414; --surf2:#1e1e1e;
      --bdr:rgba(255,255,255,0.08); --bdr2:rgba(255,255,255,0.16);
      --txt:#f0f0f0; --muted:#777; --red:#ff3b3b;
      --grn:#2ecc71; --blu:#3b82f6;
      --mono:'DM Mono',monospace; --ui:'Syne',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--ui);}

    /* ── PORTRAIT layout ── */
    #app{
      display:flex;flex-direction:column;
      height:100dvh;
      padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
      overflow:hidden;
    }

    /* header */
    #hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;border-bottom:1px solid var(--bdr);flex-shrink:0;}
    .logo{font-size:20px;font-weight:800;letter-spacing:-.5px;}
    .logo em{color:var(--red);font-style:normal;}
    #hdr-r{display:flex;align-items:center;gap:8px;}
    #sdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s;}
    #sdot.g{background:var(--grn);box-shadow:0 0 6px var(--grn);}
    #sdot.r{background:var(--red);box-shadow:0 0 6px var(--red);animation:bk 1s infinite;}
    @keyframes bk{0%,100%{opacity:1}50%{opacity:.2}}
    #gpill{font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:100px;border:1px solid var(--bdr2);background:var(--surf);color:var(--muted);cursor:pointer;white-space:nowrap;}
    #gpill.on{border-color:var(--grn);color:var(--grn);background:rgba(46,204,113,.08);}

    /* base body — always flex, media queries set direction */
    #body{flex:1;min-height:0;}

    /* ── PORTRAIT: viewfinder ── */
    #vf{position:relative;background:#000;flex-shrink:0;overflow:hidden;}
    /* 9:16 aspect via padding trick */
    @media(orientation:portrait){
      #vf{width:100%;padding-bottom:177.78%;}
      #vf>*{position:absolute;inset:0;}
    }
    #cam{width:100%;height:100%;object-fit:cover;display:block;}
    #ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;}
    .ph-ring{width:54px;height:54px;border-radius:50%;border:1px solid var(--bdr2);background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:22px;}
    .ph-lbl{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.6;}
    #rbadge{position:absolute;top:12px;left:12px;display:none;align-items:center;gap:5px;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);padding:4px 10px 4px 7px;border-radius:100px;font-family:var(--mono);font-size:11px;color:#fff;}
    #rbadge .rd{width:7px;height:7px;border-radius:50%;background:var(--red);animation:bk 1s infinite;}
    #fmtbadge{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);font-family:var(--mono);font-size:10px;color:var(--muted);padding:3px 9px;border-radius:100px;}

    /* ── PORTRAIT: scroll area ── */
    #pscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;display:flex;flex-direction:column;gap:10px;}

    /* ── PORTRAIT: footer ── */
    #pfooter{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--bdr);flex-shrink:0;}

    /* ── LANDSCAPE layout ── */
    @media(orientation:landscape){
      /* hide portrait footer, show landscape controls */
      #pfooter{display:none;}
      #lctrls{display:flex !important;}

      /* side-by-side: viewfinder left, panel right */
      #body{display:flex;flex-direction:row;flex:1;min-height:0;overflow:hidden;}

      /* viewfinder: 16:9 horizontal — width = height * 16/9, done in JS */
      #vf{
        padding-bottom:0 !important;
        position:relative;
        height:100%;
        flex-shrink:0;
        border-radius:0;
      }
      #vf>*{position:absolute;inset:0;}

      /* right panel: must be fully bounded so #rscroll can scroll */
      #rpanel{
        flex:1;
        min-width:0;
        display:flex;
        flex-direction:column;
        overflow:hidden;   /* clips children so flex chain works */
        border-left:1px solid var(--bdr);
      }
      #lctrls{
        flex-shrink:0;
        gap:8px;
        padding:10px 12px;
        border-bottom:1px solid var(--bdr);
      }
      /* THIS is the scrollable area — flex:1 + overflow-y:auto gives it a bounded height */
      #rscroll{
        flex:1;
        min-height:0;
        overflow-y:auto;
        -webkit-overflow-scrolling:touch;
        overscroll-behavior:contain;
        padding:12px;
        display:flex;flex-direction:column;
        gap:10px;
      }
    }

    /* ── PORTRAIT layout ── */
    @media(orientation:portrait){
      #lctrls{display:none;}
      /* portrait: body stacks vertically, rscroll scrolls the panels */
      #body{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;}
      #rpanel{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;}
      #rscroll{
        flex:1;
        min-height:0;
        overflow-y:auto;
        -webkit-overflow-scrolling:touch;
        overscroll-behavior:contain;
        padding:12px;
        display:flex;flex-direction:column;
        gap:10px;
      }
    }

    /* ── buttons ── */
    .cbtn{flex:1;padding:12px 8px;border-radius:10px;border:1px solid var(--bdr2);background:var(--surf);color:var(--txt);font-family:var(--ui);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;}
    .cbtn:active{transform:scale(.97);}
    .cbtn:disabled{opacity:.3;pointer-events:none;}
    .cbtn.rec{background:var(--red);border-color:transparent;color:#fff;}
    .cbtn.stop{border-color:var(--red);color:var(--red);}

    /* ── panels ── */
    .panel{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;overflow:hidden;}
    .phdr{padding:9px 13px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;}
    .plbl{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;}
    .pbdy{padding:11px 13px;}

    /* toast */
    #toast{font-family:var(--mono);font-size:11px;padding:9px 13px;border-radius:9px;line-height:1.5;display:none;}
    #toast.on{display:block;}
    #toast.s{background:rgba(46,204,113,.1);color:var(--grn);border:1px solid rgba(46,204,113,.2);}
    #toast.e{background:rgba(255,59,59,.1);color:#ff6b6b;border:1px solid rgba(255,59,59,.2);}
    #toast.i{background:rgba(59,130,246,.1);color:#7ab3ff;border:1px solid rgba(59,130,246,.2);}

    /* fields */
    .fl{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:.05em;text-transform:uppercase;}
    .fw{margin-bottom:10px;}
    .fw:last-child{margin-bottom:0;}
    input[type=text]{width:100%;padding:8px 11px;font-size:13px;font-family:var(--mono);border:1px solid var(--bdr2);border-radius:8px;background:var(--surf2);color:var(--txt);-webkit-appearance:none;}
    input[type=text]:focus{outline:none;border-color:var(--blu);}

    /* dropdown */
    .selwrap{position:relative;}
    select.sfdrop{width:100%;padding:8px 28px 8px 11px;font-size:13px;font-family:var(--mono);border:1px solid var(--bdr2);border-radius:8px;background:var(--surf2);color:var(--txt);-webkit-appearance:none;appearance:none;cursor:pointer;}
    select.sfdrop:disabled{opacity:.4;}
    select.sfdrop:focus{outline:none;border-color:var(--blu);}
    .selarrow{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:10px;}
    .sfhint{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5;}

    /* recordings */
    .ri{padding:11px 13px;border-bottom:1px solid var(--bdr);display:flex;flex-direction:column;gap:7px;}
    .ri:last-child{border-bottom:none;}
    .ri-top{display:flex;align-items:center;gap:9px;}
    .ri-thumb{width:40px;height:40px;border-radius:8px;background:var(--surf2);border:1px solid var(--bdr2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;}
    .ri-info{flex:1;min-width:0;}
    .ri-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ri-sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:1px;}
    .ri-btns{display:flex;gap:5px;}
    .rb{flex:1;padding:7px 3px;border-radius:7px;font-size:11px;font-weight:700;font-family:var(--ui);border:1px solid var(--bdr2);background:var(--surf2);color:var(--muted);cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:3px;transition:all .15s;}
    .rb:active{transform:scale(.96);}
    .rb.up{background:var(--blu);border-color:transparent;color:#fff;}
    .rb.done{background:rgba(46,204,113,.12);border-color:rgba(46,204,113,.25);color:var(--grn);}
    .rn-row{display:flex;gap:5px;}
    .rn-row input{flex:1;margin:0;padding:7px 9px;font-size:12px;}
    .rn-ok{padding:7px 11px;border-radius:7px;border:none;background:var(--blu);color:#fff;font-size:12px;font-weight:700;font-family:var(--ui);cursor:pointer;}
    .rn-x{padding:7px 9px;border-radius:7px;border:1px solid var(--bdr2);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;}
    .empty{font-family:var(--mono);font-size:11px;color:var(--muted);padding:18px 13px;text-align:center;line-height:1.8;}

    /* debug banner */
    #dbg{display:none;font-family:var(--mono);font-size:10px;color:#ffaa00;background:rgba(255,170,0,.1);border:1px solid rgba(255,170,0,.2);border-radius:8px;padding:8px 12px;white-space:pre-wrap;word-break:break-all;}
    #dbg.show{display:block;}
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="hdr">
    <div class="logo">cap<em>.</em>ture</div>
    <div id="hdr-r">
      <div id="sdot"></div>
      <button id="gpill" onclick="signIn()">sign in to google</button>
    </div>
  </div>

  <!-- BODY: flex row in landscape, flex column in portrait -->
  <div id="body">

    <!-- VIEWFINDER -->
    <div id="vf">
      <video id="cam" autoplay muted playsinline></video>
      <div id="ph">
        <div class="ph-ring">📷</div>
        <div class="ph-lbl">tap start camera<br>to begin</div>
      </div>
      <div id="rbadge"><div class="rd"></div><span id="rtimer">0:00</span><span style="color:var(--muted);margin-left:3px">REC</span></div>
      <div id="fmtbadge">16:9</div>
    </div>

    <!-- RIGHT PANEL (landscape) / inline (portrait via display:contents) -->
    <div id="rpanel">

      <!-- landscape-only controls -->
      <div id="lctrls" style="display:none;">
        <button class="cbtn" id="lbtn-cam" onclick="startCamera()">📷 Camera</button>
        <button class="cbtn rec" id="lbtn-rec" onclick="toggleRecord()" disabled>⏺ Record</button>
      </div>

      <!-- scrollable content — works in both orientations -->
      <div id="rscroll">

        <div id="toast"></div>
        <div id="dbg"></div>

        <!-- Drive panel -->
        <div class="panel">
          <div class="phdr"><span class="plbl">Google Drive</span></div>
          <div class="pbdy">
            <div class="fw">
              <div class="fl">Client ID</div>
              <input type="text" id="client-id" placeholder="paste your client id" oninput="saveSetting()"/>
            </div>
            <div class="fw">
              <div class="fl">Subfolder in Entrevues</div>
              <div class="selwrap">
                <select class="sfdrop" id="sfdrop" onchange="onFolderChange()" disabled>
                  <option value="">sign in to load folders</option>
                </select>
                <span class="selarrow">▼</span>
              </div>
              <div class="sfhint" id="sfhint">sign in first, then choose a subfolder</div>
            </div>
          </div>
        </div>

        <!-- Recordings panel -->
        <div class="panel">
          <div class="phdr">
            <span class="plbl">Recordings</span>
            <span id="rcnt" style="font-family:var(--mono);font-size:10px;color:var(--muted)">0</span>
          </div>
          <div id="rlist"><div class="empty">no recordings yet.<br>press record to start.</div></div>
        </div>

      </div><!-- /rscroll -->
    </div><!-- /rpanel -->

  </div><!-- /body -->

  <!-- PORTRAIT footer controls -->
  <div id="pfooter">
    <button class="cbtn" id="pbtn-cam" onclick="startCamera()">📷 Start Camera</button>
    <button class="cbtn rec" id="pbtn-rec" onclick="toggleRecord()" disabled>⏺ Record</button>
  </div>

</div><!-- /app -->

<script>
'use strict';
let stream=null, mr=null, chunks=[], timerInt=null;
let secs=0, recs=[], recording=false, tok=null, tokExp=0;
let renIdx=null, gsi=null;
let entId=null, selFid=null, selFname=null;
const FOLDER='Entrevues';

/* ── debug log ── */
function dbg(msg){
  const el=document.getElementById('dbg');
  el.className='show';
  el.textContent=(el.textContent?el.textContent+'\n':'')+msg;
}

/* ── set viewfinder size ── */
function fixVfSize(){
  const vf=document.getElementById('vf');
  const isLand=window.matchMedia('(orientation:landscape)').matches;
  if(isLand){
    // Camera is 16:9 horizontal — width = height * (16/9)
    const h=document.getElementById('body').offsetHeight;
    const w=Math.floor(h*16/9);
    vf.style.width=w+'px';
    vf.style.height='100%';
    vf.style.paddingBottom='0';
    vf.style.position='relative';
  } else {
    // Portrait: 9:16 handled by CSS padding-bottom trick
    vf.style.width='';
    vf.style.height='';
    vf.style.position='';
    vf.style.paddingBottom='';
  }
}
window.addEventListener('resize',fixVfSize);
window.addEventListener('orientationchange',()=>setTimeout(fixVfSize,150));

/* ── persist ── */
function saveSetting(){ localStorage.setItem('vr_cid',document.getElementById('client-id').value); if(selFid)localStorage.setItem('vr_fid',selFid); if(selFname)localStorage.setItem('vr_fn',selFname); }
function loadSetting(){ const c=localStorage.getItem('vr_cid'),f=localStorage.getItem('vr_fid'),n=localStorage.getItem('vr_fn'); if(c)document.getElementById('client-id').value=c; if(f)selFid=f; if(n)selFname=n; }
function saveTok(t,exp){ const e=Date.now()+((exp||3600)-60)*1000; localStorage.setItem('vr_tok',t); localStorage.setItem('vr_exp',String(e)); tok=t; tokExp=e; }
function loadTok(){ const t=localStorage.getItem('vr_tok'),e=parseInt(localStorage.getItem('vr_exp')||'0'); if(t&&e&&Date.now()<e){tok=t;tokExp=e;return true;} return false; }
function clearTok(){ localStorage.removeItem('vr_tok');localStorage.removeItem('vr_exp');tok=null;tokExp=0; }
function tokOk(){ return !!(tok&&Date.now()<tokExp); }

/* ── toast ── */
function toast(msg,t='i'){ const el=document.getElementById('toast'); el.innerHTML=msg; el.className='on '+t; clearTimeout(el._x); el._x=setTimeout(()=>el.className='',6000); }

/* ── dot ── */
function setDot(s){ document.getElementById('sdot').className=s; }

/* ── camera ── */
async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080},aspectRatio:{ideal:16/9}},
      audio:{echoCancellation:true,noiseSuppression:true,sampleRate:44100}
    });
    const v=document.getElementById('cam');
    v.srcObject=stream;
    setAllBtns('cam',true); setAllBtns('rec',false);
    localStorage.setItem('vr_cam','1');
    toast('camera ready — press record','i');
    dbg('camera started ok');
  }catch(err){
    toast('camera denied — allow in browser settings','e');
    dbg('camera error: '+err.message);
  }
}

function setAllBtns(which,disabled){
  const ids=which==='cam'?['pbtn-cam','lbtn-cam']:['pbtn-rec','lbtn-rec'];
  ids.forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=disabled;});
}
function setRecBtnState(label,cls){
  ['pbtn-rec','lbtn-rec'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent=label;el.className='cbtn '+cls;}});
}

/* ── recording ── */
function toggleRecord(){ recording?stopRec():startRec(); }

function getBestMime(){
  const list=[
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4;codecs=avc1,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=h264,opus',
    'video/webm;codecs=vp9,opus',
    'video/webm'
  ];
  for(const m of list){ try{ if(MediaRecorder.isTypeSupported(m))return m; }catch(e){} }
  return '';
}

function startRec(){
  if(!stream){ toast('start camera first','e'); return; }
  chunks=[];
  const mime=getBestMime();
  dbg('starting rec, mime='+mime);
  try{
    mr=mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
  }catch(err){
    dbg('MediaRecorder fallback: '+err.message);
    try{ mr=new MediaRecorder(stream); }catch(e2){ toast('recorder failed: '+e2.message,'e'); return; }
  }
  // Capture mime NOW before any async happens — iOS clears it later
  const useMime=mr.mimeType||mime||'video/mp4';
  dbg('actual mimeType='+useMime);

  mr.ondataavailable=e=>{
    dbg('chunk: '+(e.data?e.data.size:'null'));
    if(e.data&&e.data.size>0) chunks.push(e.data);
  };

  // KEY FIX: use a flag + small delay so all chunks arrive before we process
  mr.onstop=()=>{
    dbg('onstop fired, chunks='+chunks.length);
    // Give iOS 200ms to flush any final chunk
    setTimeout(()=>finalizeRec(useMime), 200);
  };

  mr.onerror=err=>{ dbg('mr error: '+JSON.stringify(err)); toast('recorder error','e'); };

  // Request data every 500ms AND on stop — crucial for iOS
  mr.start(500);
  recording=true; secs=0;
  document.getElementById('rbadge').style.display='flex';
  document.getElementById('fmtbadge').textContent=useMime.includes('mp4')?'MP4 · 16:9':'WebM · 16:9';
  setRecBtnState('⏹ Stop','cbtn stop');
  setDot('r');
  timerInt=setInterval(()=>{ secs++; const m=Math.floor(secs/60),s=secs%60; document.getElementById('rtimer').textContent=`${m}:${s.toString().padStart(2,'0')}`; },1000);
  toast('recording…','i');
}

function stopRec(){
  clearInterval(timerInt);
  if(mr&&mr.state!=='inactive'){
    // Request final chunk before stopping
    try{ mr.requestData(); }catch(e){}
    mr.stop();
  }
  recording=false;
  document.getElementById('rbadge').style.display='none';
  setRecBtnState('⏺ Record','cbtn rec');
  setDot('g');
}

function finalizeRec(mime){
  dbg('finalizeRec: chunks='+chunks.length+' mime='+mime);
  if(!chunks.length){ toast('no data — try recording longer','e'); return; }
  const ext=mime.includes('mp4')?'mp4':'webm';
  let blob;
  try{ blob=new Blob(chunks,{type:mime}); }
  catch(e){ dbg('blob err: '+e.message); blob=new Blob(chunks); }
  dbg('blob size='+blob.size+' type='+blob.type);
  if(!blob||blob.size<100){ toast('video too small — try again','e'); return; }
  const name='capture_'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const size=(blob.size/1048576).toFixed(1)+' MB';
  let url='';
  try{ url=URL.createObjectURL(blob); dbg('url ok'); }catch(e){ dbg('url err: '+e.message); }
  recs.unshift({name,ext,blob,size,url,uploaded:false});
  dbg('added to recs, total='+recs.length);
  renderRecs();
  toast('✓ saved '+name+'.'+ext+' ('+size+') — tap upload','s');
  // scroll right panel to show recordings
  setTimeout(()=>{
    const s=document.getElementById('rscroll');
    if(s) s.scrollTop=s.scrollHeight;
  },300);
}

/* ── render recordings ── */
function renderRecs(){
  document.getElementById('rcnt').textContent=recs.length;
  const list=document.getElementById('rlist');
  if(!recs.length){ list.innerHTML='<div class="empty">no recordings yet.<br>press record to start.</div>'; return; }
  list.innerHTML=recs.map((r,i)=>{
    const ren=renIdx===i;
    return `<div class="ri" id="ri-${i}">
      <div class="ri-top">
        <div class="ri-thumb">🎬</div>
        <div class="ri-info">
          <div class="ri-name">${r.name}.${r.ext}</div>
          <div class="ri-sub">${r.size} · ${r.ext.toUpperCase()}</div>
        </div>
      </div>
      ${ren?`<div class="rn-row"><input type="text" id="rni-${i}" value="${r.name}"><button class="rn-ok" onclick="saveRename(${i})">save</button><button class="rn-x" onclick="cancelRename()">✕</button></div>`:''}
      <div class="ri-btns">
        <a class="rb" href="${r.url}" download="${r.name}.${r.ext}">⬇ save</a>
        <button class="rb" onclick="startRename(${i})">✏ rename</button>
        <button class="rb ${r.uploaded?'done':'up'}" onclick="upload(${i})" ${r.uploaded?'disabled':''}>
          ${r.uploaded?'✓ done':'☁ upload'}
        </button>
      </div>
    </div>`;
  }).join('');
}
function startRename(i){ renIdx=i; renderRecs(); setTimeout(()=>{const el=document.getElementById('rni-'+i);if(el){el.focus();el.select();}},40); }
function saveRename(i){ const el=document.getElementById('rni-'+i); if(el){const n=el.value.trim().replace(/[\/\\:*?"<>|]/g,'_');if(n)recs[i].name=n;} renIdx=null; renderRecs(); }
function cancelRename(){ renIdx=null; renderRecs(); }

/* ── Drive ── */
async function loadFolders(){
  const sel=document.getElementById('sfdrop');
  sel.disabled=true; sel.innerHTML='<option>finding Entrevues…</option>';
  try{
    const q=`name='${FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&includeItemsFromAllDrives=true&supportsAllDrives=true&corpora=allDrives&fields=files(id,name)`,{headers:{Authorization:`Bearer ${tok}`}});
    const d=await r.json();
    if(!d.files?.length){ sel.innerHTML='<option>⚠ Entrevues not found</option>'; document.getElementById('sfhint').textContent="make sure it's shared with your google account."; return; }
    entId=d.files[0].id;
    const q2=`'${entId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const r2=await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q2)}&includeItemsFromAllDrives=true&supportsAllDrives=true&orderBy=name&fields=files(id,name)&pageSize=50`,{headers:{Authorization:`Bearer ${tok}`}});
    const d2=await r2.json();
    const subs=d2.files||[];
    const opts=[{id:entId,name:'📁 Entrevues (root)'},...subs.map(f=>({id:f.id,name:'📁 '+f.name}))];
    sel.innerHTML=opts.map(o=>`<option value="${o.id}" ${selFid===o.id?'selected':''}>${o.name}</option>`).join('');
    sel.disabled=false;
    if(selFid&&opts.find(o=>o.id===selFid)) sel.value=selFid;
    else{ selFid=opts[0].id; selFname=opts[0].name; sel.value=selFid; saveSetting(); }
    document.getElementById('sfhint').textContent=subs.length?subs.length+' subfolder'+(subs.length!==1?'s':'')+' in Entrevues':'no subfolders — saving to Entrevues root';
  }catch(e){ sel.innerHTML=`<option>error: ${e.message}</option>`; dbg('loadFolders err: '+e.message); }
}
function onFolderChange(){ const s=document.getElementById('sfdrop'); selFid=s.value; selFname=s.options[s.selectedIndex]?.text||''; saveSetting(); }

/* ── auth ── */
function buildGsi(cid){
  gsi=google.accounts.oauth2.initTokenClient({
    client_id:cid,
    scope:'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',
    callback:resp=>{
      if(resp?.access_token){ saveTok(resp.access_token,resp.expires_in); markOn(); toast('signed in','s'); loadFolders(); }
      else toast('sign-in failed','e');
    },
    error_callback:err=>toast('auth error: '+(err.message||'?'),'e')
  });
}
function markOn(){ document.getElementById('gpill').textContent='✓ connected'; document.getElementById('gpill').classList.add('on'); setDot('g'); }
function signIn(){ const c=document.getElementById('client-id').value.trim(); if(!c){toast('paste client id first','e');return;} saveSetting(); buildGsi(c); gsi.requestAccessToken(); }
function silentRefresh(cid){ if(!cid)return; try{ google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',prompt:'',callback:r=>{if(r?.access_token){saveTok(r.access_token,r.expires_in);markOn();loadFolders();}},error_callback:()=>{}}).requestAccessToken({prompt:''}); }catch(e){} }

/* ── upload ── */
async function upload(i){
  if(!tokOk()){toast('session expired — sign in again','e');return;}
  if(!selFid){toast('choose a subfolder first','e');return;}
  const rec=recs[i];
  if(!rec?.blob||rec.blob.size===0){toast('video is empty','e');return;}
  const fn=rec.name+'.'+rec.ext;
  toast('uploading '+fn+'…','i');
  try{
    const meta={name:fn,parents:[selFid]};
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
    form.append('file',rec.blob,fn);
    const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name&supportsAllDrives=true',{method:'POST',headers:{Authorization:`Bearer ${tok}`},body:form});
    if(res.ok){ recs[i].uploaded=true; renderRecs(); toast('✓ uploaded to '+selFname,'s'); }
    else{ const e=await res.json().catch(()=>({})); if(e.error?.code===401){clearTok();toast('session expired','e');}else toast('upload failed: '+(e.error?.message||res.status),'e'); }
  }catch(e){toast('error: '+e.message,'e');}
}

/* ── init ── */
window.addEventListener('load',()=>{
  loadSetting();
  fixVfSize();
  if(loadTok()){ markOn(); loadFolders(); }
  const cid=document.getElementById('client-id').value.trim();
  if(localStorage.getItem('vr_cam')==='1') startCamera();
  const w=setInterval(()=>{ if(typeof google!=='undefined'&&google.accounts){ clearInterval(w); if(cid){buildGsi(cid);if(!tokOk())silentRefresh(cid);} } },300);
});
</script>
